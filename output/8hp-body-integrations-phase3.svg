<text xml:space="preserve" text-anchor="start" x="4" y="-101.5" font-family="arial" font-size="14.00">PMU16 output configured in PMU software as a CAN&#45;triggered high&#45;side switch:</text>
<text xml:space="preserve" text-anchor="start" x="4" y="-85.75" font-family="arial" font-size="14.00"> &#160;&#45; Trigger source: MaxxECU CAN broadcast of &quot;gear position = R&quot;</text>
<text xml:space="preserve" text-anchor="start" x="4" y="-70" font-family="arial" font-size="14.00"> &#160;&#160;&#160;(MaxxECU MTune: 8HP data → gear index → transmit on CAN)</text>
<text xml:space="preserve" text-anchor="start" x="4" y="-54.25" font-family="arial" font-size="14.00"> &#160;&#45; Output mode: high&#45;side switch, +12V from PMU16 BATT+ rail</text>
<text xml:space="preserve" text-anchor="start" x="4" y="-38.5" font-family="arial" font-size="14.00"> &#160;&#45; Current limit: set 10A (headroom over ~4&#45;8A actual draw)</text>
<text xml:space="preserve" text-anchor="start" x="4" y="-22.75" font-family="arial" font-size="14.00"> &#160;&#45; No PWM, no soft&#45;start — binary on/off</text>
<text xml:space="preserve" text-anchor="start" x="4" y="-7" font-family="arial" font-size="14.00">Replaces the Phase 1 discrete relay entirely — one PMU16 output does the work of the previous GPO+relay+fuse combination. See harnesses/power&#45;distribution.wv for PMU16 output channel allocation.</text>
